{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>{{ t('backup.change_password') }}</h1>
  {% if settings.must_change_password %}<p class="hint">{{ t('auth.must_change') }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    {% if settings.password_hash %}
    <label>{{ t('auth.current') }} <input type="password" name="current" autocomplete="current-password" autofocus></label>
    {% endif %}
    <label>{{ t('auth.new') }} <input type="password" name="new" autocomplete="new-password" {{ 'autofocus' if not settings.password_hash }}></label>
    <label>{{ t('auth.repeat') }} <input type="password" name="repeat" autocomplete="new-password"></label>
    <button type="submit">{{ t('common.save') }}</button>
  </form>
</section>
{% endblock %}
